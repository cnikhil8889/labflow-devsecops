# CNK | Nikhil Kumar Choudavarapu
name: CodeQL
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  security-events: write
concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true
jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: github/codeql-action/init@v4
        with: {languages: python}
      - name: Analyze without Security-tab upload
        uses: github/codeql-action/analyze@v4
        with:
          output: codeql-results
          upload: never
          upload-database: false
      - name: Preserve CNK CodeQL report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CNK-codeql-sarif
          path: codeql-results/*.sarif
          if-no-files-found: error
      - name: Fail on CodeQL warnings or errors
        run: python scripts/check-sarif.py codeql-results
